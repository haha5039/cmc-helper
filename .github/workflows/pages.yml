name: Deploy KEY calculator
on:
  push:
    branches: [main]
    paths: ['site/**', 'tests/web-*', 'app-preparation/com/haha5039/cmc/CmcOtp.java', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.availability.outputs.enabled }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Verify browser calculation against the app
        run: node --test tests/web-*.test.mjs
      - name: Check whether Pages is enabled
        id: availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { appendFileSync } from 'node:fs';
          const response = await fetch(`${process.env.GITHUB_API_URL}/repos/${process.env.GITHUB_REPOSITORY}/pages`, {
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json' }
          });
          if (![200, 404].includes(response.status)) throw new Error(`Pages state check failed: HTTP ${response.status}`);
          const enabled = response.status === 200;
          appendFileSync(process.env.GITHUB_OUTPUT, 'enabled=' + enabled + String.fromCharCode(10));
          console.log(enabled ? 'Pages is enabled.' : '::notice::Calculator checks passed. Pages is not enabled for this repository; deployment is skipped.');
          JS
      - if: steps.availability.outputs.enabled == 'true'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - if: steps.availability.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site
  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
